services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - redis
      - mongo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - storage_data:/app/storage

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    env_file: ./backend/.env
    depends_on:
      - redis
      - mongo
    volumes:
      - ./backend:/app
      - storage_data:/app/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # MongoDB for local development. In production, point MONGODB_URI at Atlas
  # and this service can be removed.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file: ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  mongo_data:
  storage_data:
